name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shinonome-apk
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the USB site
        working-directory: site
        run: |
          npm ci --ignore-scripts
          node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  # Set the repository variable PUBLISH_SITE to true, and GitHub Actions as the Pages source, to run this.
  # The site pushes the APK built above to the phone, so its signing key doesn't matter.
  site:
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_SITE == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Runs for a tag such as v0.1.0. To sign with your own key, add the repository secrets
  # SHINONOME_KEYSTORE_BASE64, SHINONOME_KEYSTORE_PASSWORD, SHINONOME_KEY_ALIAS and SHINONOME_KEY_PASSWORD.
  # Without them the APK uses a throwaway debug key, so each release must be installed fresh.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - name: Build the release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SHINONOME_KEYSTORE_BASE64 }}
          SHINONOME_KEYSTORE_PASSWORD: ${{ secrets.SHINONOME_KEYSTORE_PASSWORD }}
          SHINONOME_KEY_ALIAS: ${{ secrets.SHINONOME_KEY_ALIAS }}
          SHINONOME_KEY_PASSWORD: ${{ secrets.SHINONOME_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export SHINONOME_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "shinonome-$GITHUB_REF_NAME.apk"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" shinonome-*.apk --generate-notes --verify-tag
